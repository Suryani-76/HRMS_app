name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hrms-app/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: hrms-app

      - name: Create .env file for production build
        run: |
          URL="${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}"
          KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$URL" ]; then URL="https://qwygpcovmlobcmwcptvz.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="sb_publishable_gAOufq0KVS9ugonSUIC8cA_i5DAtaII"; fi
          echo "VITE_SUPABASE_URL=$URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env
          echo "VITE_APP_URL=https://suryani-76.github.io/HRMS_app" >> .env
        working-directory: hrms-app

      - name: Build React app
        run: npm run build
        working-directory: hrms-app
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hrms-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
