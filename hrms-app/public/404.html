<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Oklut HRMS</title>
    <script>
      // GitHub Pages SPA redirect workaround
      // Stores the full path in sessionStorage and redirects to root
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
